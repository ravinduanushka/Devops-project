apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  labels:
    app: hospital-server
data:
  PORT: "5000"
  MONGO_URI: "mongodb://mongodb-service:27017/hospital"
  CLIENT_ORIGIN: "*"
  DOCTOR_SHARED_EMAIL: "anusikan0426@gmail.com"
  DOCTOR_VANCE_PASSWORD: "vancedoctor"
  DOCTOR_SANATH_PASSWORD: "sanathdoctor"
  DOCTOR_PRIYANTHA_PASSWORD: "priyanthadoctor"
  DOCTOR_CHAMPA_PASSWORD: "champadoctor"
  DOCTOR_MALANI_PASSWORD: "malanidoctor"
  RECEPTIONIST_EMAIL: "anusikan0426@gmail.com"
  RECEPTIONIST_PASSWORD: "webreciption56"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
  labels:
    app: hospital-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital-server
  template:
    metadata:
      labels:
        app: hospital-server
    spec:
      containers:
        - name: hospital-server
          image: hospital-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: server-config
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: server-service
  labels:
    app: hospital-server
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: hospital-server
