services:

  mongodb:
    image: mongo:6.0
    container_name: hospital-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet || mongo --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  server:
    build: ./server
    image: hospital-server:latest
    container_name: hospital-server  
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hospital
      CLIENT_ORIGIN: http://localhost:3000
      DOCTOR_SHARED_EMAIL: anusikan0426@gmail.com
      DOCTOR_VANCE_PASSWORD: vancedoctor
      DOCTOR_SANATH_PASSWORD: sanathdoctor
      DOCTOR_PRIYANTHA_PASSWORD: priyanthadoctor
      DOCTOR_CHAMPA_PASSWORD: champadoctor
      DOCTOR_MALANI_PASSWORD: malanidoctor
      RECEPTIONIST_EMAIL: anusikan0426@gmail.com
      RECEPTIONIST_PASSWORD: webreciption56
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build: ./client
    image: hospital-client:latest
    container_name: hospital-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongodb_data:
